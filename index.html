<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090909" />
  <meta name="color-scheme" content="light dark" />
  <meta name="application-name" content="Traço" />
  <meta name="description" content="Traço — treino, progressão, constância e evolução corporal." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Traço" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <script>
    (()=>{try{
      const perfKey='traco_performance_console_v1';
      let theme=localStorage.getItem('traco_theme');
      if(!localStorage.getItem(perfKey)){
        theme='dark';
        localStorage.setItem('traco_theme','dark');
        localStorage.setItem(perfKey,'1');
      }
      theme=theme==='light'?'light':'dark';
      document.documentElement.dataset.theme=theme;
      document.documentElement.dataset.design='performance';
      document.documentElement.style.colorScheme=theme;
      const color=document.querySelector('meta[name="theme-color"]');
      if(color)color.content=theme==='dark'?'#090909':'#F6F5F0';
      const status=document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
      if(status)status.content=theme==='dark'?'black-translucent':'default';
    }catch{}})();
  </script>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/traco-icon-180.png" />
