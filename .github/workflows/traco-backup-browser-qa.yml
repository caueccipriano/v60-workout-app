name: Traço backup import browser safety
on:
  pull_request:
    paths:
      - app.js
      - traco-backup-guard.js
      - test/traco-backup-guard.test.cjs
      - test/traco-backup-browser.spec.cjs
      - traco-simple.js
      - traco-simple.css
      - traco-pantry.js
      - traco-pantry.css
      - test/traco-simple-browser.spec.cjs
      - index.html
      - manifest.json
      - assets/icon.svg
      - scripts/render-traco-icons.py
      - .github/workflows/traco-backup-browser-qa.yml
  workflow_dispatch:
jobs:
  synthetic-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser test runner
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock @playwright/test@1.55.1
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Render iPhone and PWA icons before browser checks
        run: |
          python -m pip install --quiet cairosvg==2.7.1
          python scripts/render-traco-icons.py
      - name: Start isolated static preview
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/traco-browser.log 2>&1 &
      - name: Synthetic import, validation and rollback
        run: npx playwright test test/traco-backup-browser.spec.cjs test/traco-simple-browser.spec.cjs --browser=${{ matrix.browser }} --reporter=line --workers=1
