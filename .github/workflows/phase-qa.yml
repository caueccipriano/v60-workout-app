name: Training phase quality
on:
  pull_request:
    paths:
      - "traco-phase-progress.js"
      - "traco-lab.js"
      - "test/traco-phase-progress.test.cjs"
      - ".github/workflows/phase-qa.yml"
  workflow_dispatch:
jobs:
  phase-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check phase JavaScript
        run: |
          node --check traco-phase-progress.js
          node --check traco-lab.js
      - name: Test offline phase summary
        run: node --test test/traco-phase-progress.test.cjs
