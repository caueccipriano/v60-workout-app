name: Deploy Traço to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-v3-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check exercise-guides.js
          node --check exercise-guides-v4.js
          node --check exercise-videos.js
          node --check v60-personal-progress.js
          node --check v60-aesthetic-core.js
          node --check v60-smart-sequence.js
          node --check traco-brand.js
          node --check traco-performance.js
          node --check traco-gym-ux.js
          node --check traco-coach.js
          node --check traco-body-coach.js
          node --check traco-lab.js
          node --check traco-evolution.js
          node --check traco-rest-background.js
          node --check traco-runtime.js
          node --check eu-bridge.js
      - name: Validate Traço branding
        run: |
          node <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const version=JSON.parse(fs.readFileSync('version.json','utf8'));
          const index=fs.readFileSync('index.html','utf8');
          if(manifest.short_name!=='Traço') throw new Error('Manifest brand mismatch');
          if(version.name!=='Traço'||version.version!=='2.4.1') throw new Error('Version brand mismatch');
          if(!index.includes('<title>Traço</title>')) throw new Error('Document title mismatch');
          for(const file of ['assets/icon.svg','assets/traco-icon-180.png','assets/traco-icon-192.png','assets/traco-icon-512.png','traco-brand.js','traco-brand.css','traco-theme.css','traco-performance.js','traco-performance.css','traco-gym-ux.js','traco-gym-ux.css','privacy.html','terms.html','support.html','DESIGN_SYSTEM.md']){
            if(!fs.existsSync(file)) throw new Error(`Missing brand asset: ${file}`);
          }
          console.log('Traço brand OK');
          NODE
      - name: Validate dark theme and mobile body form
        run: |
          node <<'NODE'
          const fs=require('fs');
          const css=fs.readFileSync('traco-theme.css','utf8');
          const brand=fs.readFileSync('traco-brand.js','utf8');
          const index=fs.readFileSync('index.html','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const guides=fs.readFileSync('exercise-guides-v4.js','utf8');
          const core=fs.readFileSync('v60-aesthetic-core.js','utf8');
          for(const required of [
            ':root[data-theme="dark"]',
            '--lime:#FF3B30',
            '.measure-form .form-grid>label:first-child',
            'grid-template-columns:minmax(0,1fr) minmax(0,1fr)',
            '.traco-theme-option.is-active'
          ]){
            if(!css.includes(required)) throw new Error(`Missing theme/body-layout rule: ${required}`);
          }
          for(const required of ['TRACO_THEME_KEY','tracoSetTheme','data-traco-theme="dark"','version:\'2.4.1\'']){
            if(!brand.includes(required)) throw new Error(`Missing persistent theme feature: ${required}`);
          }
          if(!index.includes("localStorage.getItem('traco_theme')")||!index.includes('traco-theme.css?v=286')||!index.includes('traco-performance.css?v=286')) throw new Error('First-paint theme bootstrap missing');
          if(!sw.includes("'./traco-theme.css'")||!sw.includes("'./traco-performance.css'")||!sw.includes("'./traco-performance.js'")||!sw.includes("'./traco-gym-ux.js'")||!sw.includes("'./traco-gym-ux.css'")||!sw.includes("'./traco-coach.js'")||!sw.includes("'./traco-coach.css'")||!sw.includes("const CACHE = 'traco-v71'")) throw new Error('Theme/cache integration missing');
          if(!guides.includes("dark?'#FF3B30':'#E9342C'")) throw new Error('Exercise guide dark palette missing');
          if(!core.includes("dark?'#FF3B30':'#E9342C'")) throw new Error('Core guide dark palette missing');
          console.log('Dark theme + body mobile layout OK: black/red, persistent, first-paint safe');
          NODE
      - name: Validate reported history and progress polish
        run: |
          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('app.js','utf8');
          const personal=fs.readFileSync('v60-personal-progress.js','utf8');
          const smart=fs.readFileSync('v60-smart-sequence.js','utf8');
          const css=fs.readFileSync('traco-theme.css','utf8');
          for(const required of [
            'V60_REPORTED_HISTORY_KEY',
            "date:'2026-09-14'",
            "date:'2026-09-17'",
            "'supino-inclinado':10",
            "'leg-press':80",
            "'puxada-aberta':30",
            "'supino-reto':20",
            "'adutora-historico':35",
            'excludeFromVolume:true'
          ]){
            if(!smart.includes(required)) throw new Error(`Missing reported-history seed: ${required}`);
          }
          for(const required of [
            'hasPartialVolume',
            'recordedLoadCount',
            'cargas registradas',
            'referências salvas',
            'baseline-chart'
          ]){
            if(!app.includes(required)) throw new Error(`Missing partial-history presentation: ${required}`);
          }
          if(!app.includes('if(s?.excludeFromVolume)return 0')) throw new Error('Partial history may leak into volume');
          if(!personal.includes('w.count?Math.max(5')||!personal.includes('w.volume?Math.max(4')) throw new Error('Zero bars may render as phantom data');
          if(!personal.includes('reps pendentes')) throw new Error('Partial-volume explanation missing');
          if(!css.includes('@media(max-width:430px)')||!css.includes('.mini-chart-baseline')) throw new Error('Mobile/progress polish CSS missing');
          console.log('Reported history + progress polish OK: XP/counts without fake volume');
          NODE
      - name: Validate editable data
        run: |
          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('app.js','utf8');
          const css=fs.readFileSync('traco-theme.css','utf8');
          for(const required of [
            'tracoOpenSessionEditor',
            'tracoSaveSessionEdit',
            'tracoDeleteSession',
            'tracoRecomputePRs',
            'tracoSyncAttendance',
            'data-edit-session',
            'tracoOpenBodyEditor',
            'tracoDeleteBody',
            'data-edit-body',
            'dados completos'
          ]){
            if(!app.includes(required)) throw new Error(`Missing editable-data feature: ${required}`);
          }
          for(const required of [
            '.traco-editor-backdrop',
            '.traco-editor-sheet',
            '.traco-editor-set',
            '.history-edit-btn',
            '.measure-edit-btn',
            'html[data-theme="dark"] .traco-editor-sheet'
          ]){
            if(!css.includes(required)) throw new Error(`Missing editor style: ${required}`);
          }
          if(!app.includes("confirm('excluir este treino do histórico?")||!app.includes("confirm('excluir esta medição?")) throw new Error('Destructive edit confirmation missing');
          if(!app.includes('tracoRecomputePRs();tracoSyncAttendance')) throw new Error('Workout edit/delete recalculation missing');
          console.log('Editable data OK: sessions + sets + measurements + delete + recalculation');
          NODE
      - name: Validate data safety guards
        run: |
          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('app.js','utf8');
          const smart=fs.readFileSync('v60-smart-sequence.js','utf8');
          const css=fs.readFileSync('traco-theme.css','utf8');
          for(const required of [
            'tracoHasDuplicateSession',
            'Já existe este treino nessa data',
            'tracoOfferUndo',
            'treino salvo como parcial',
            'partialEdited',
            "draft.excludeFromVolume=incomplete",
            "confirm('excluir este treino do histórico?')",
            "confirm('excluir esta medição?')"
          ]){
            if(!app.includes(required)) throw new Error(`Missing data safety guard: ${required}`);
          }
          if(!smart.includes('const finished=activeId&&sessions().some')) throw new Error('Sequence may advance after canceled finish');
          if(!smart.includes('if(!finished)return')) throw new Error('Sequence completion guard missing');
          if(!css.includes('.traco-undo-bar')||!css.includes('desfazer')===false) {
            if(!css.includes('.traco-undo-bar')) throw new Error('Undo snackbar style missing');
          }
          console.log('Data safety OK: partial edits + undo + duplicate guard + safe sequence');
          NODE
      - name: Validate Performance Console 2.0
        run: |
          node <<'NODE'
          const fs=require('fs');
          const js=fs.readFileSync('traco-performance.js','utf8');
          const css=fs.readFileSync('traco-performance.css','utf8');
          const index=fs.readFileSync('index.html','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          for(const required of [
            'TRACO_PERF_MIGRATION',
            "document.documentElement.dataset.design='performance'",
            "['home','home','início']",
            "['progress','chart','evolução']",
            "['workouts','dumbbell','treino']",
            'perf-workout-hero',
            'perf-exercise-console',
            'perf-media-block',
            'v60GuidePreview(ex)',
            "$('#openExerciseGuide')",
            'v60ShowGuide(ex)'
          ]){
            if(!js.includes(required)) throw new Error(`Missing Performance Console feature: ${required}`);
          }
          for(const required of [
            'TRAÇO 2.0 — PERFORMANCE CONSOLE',
            '--perf-orange:#FF3B30',
            '.perf-workout-hero',
            '.perf-exercise-console',
            '.perf-media-block',
            '.perf-bottom-nav'
          ]){
            if(!css.includes(required)) throw new Error(`Missing Performance Console style: ${required}`);
          }
          if(!index.includes('traco-performance.js?v=286')||!index.includes('traco-performance.css?v=286')) throw new Error('Performance assets not loaded');
          if(!sw.includes("'./traco-performance.js'")||!sw.includes("'./traco-performance.css'")) throw new Error('Performance assets not cached');
          if(manifest.theme_color!=='#090909') throw new Error('PWA theme is not Performance Console');
          console.log('Traço 2.0 Performance Console OK; exact media entrypoint preserved');
          NODE
      - name: Validate editor reliability and iPhone controls
        run: |
          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('app.js','utf8');
          const css=fs.readFileSync('traco-theme.css','utf8');
          const media=fs.readFileSync('exercise-videos.js','utf8');

          if(/^\s*\$\('\[data-add-set\]'\)\.forEach/m.test(app)) throw new Error('Regression: add-set uses querySelector instead of querySelectorAll');
          if(/^\s*\$\('\[data-remove-set\]'\)\.forEach/m.test(app)) throw new Error('Regression: remove-set uses querySelector instead of querySelectorAll');

          for(const required of [
            "$('[data-add-set]').forEach",
            "$('[data-remove-set]').forEach",
            "$('[data-editor-step]').forEach",
            'draft._editDate',
            'draft._completeState',
            'ex.sets.push',
            'all[idx]=JSON.parse(JSON.stringify(draft))',
            "persisted=sessions().find"
          ]){
            if(!app.includes(required)) throw new Error(`Missing editor reliability feature: ${required}`);
          }

          for(const required of [
            '.traco-editor-stepper',
            'font-size:16px !important',
            '@supports (-webkit-touch-callout:none)',
            '.traco-editor-actions .cta-lime',
            'overflow-x:hidden'
          ]){
            if(!css.includes(required)) throw new Error(`Missing iPhone editor style: ${required}`);
          }

          for(const required of [
            'tracoMediaRender',
            'tracoMediaPreview',
            'tracoAuditRenderedMedia',
            'TRACO_MEDIA_RENDER_AUDIT_RESULT',
            'traco-media-fallback'
          ]){
            if(!media.includes(required)) throw new Error(`Missing rendered-media safeguard: ${required}`);
          }

          console.log('Editor reliability OK: save + add/remove series + steppers + iPhone no-zoom + media fallback');
          NODE
      - name: Validate Redline identity and compact body
        run: |
          node <<'NODE'
          const fs=require('fs');
          const perf=fs.readFileSync('traco-performance.css','utf8');
          const theme=fs.readFileSync('traco-theme.css','utf8');
          const media=fs.readFileSync('exercise-videos.js','utf8');
          const index=fs.readFileSync('index.html','utf8');
          if(!perf.includes('--perf-orange:#FF3B30')) throw new Error('Redline primary color missing');
          if(!theme.includes('--lime:#FF3B30')) throw new Error('Redline theme color missing');
          if(!perf.includes('Traço 2.1 — compact body mobile')||!perf.includes('grid-template-columns:minmax(0,1fr) minmax(0,1fr)')) throw new Error('compact body mobile 2-column missing');
          if(!media.includes('const TRACO_VIDEO_LIBRARY')) throw new Error('Exact real video map missing');
          if(/provider:'vimeo'/.test(media)) throw new Error('Vimeo provider still present');
          const videoEntries=[...media.matchAll(/provider:'youtube'/g)].length;
          if(videoEntries!==37) throw new Error(`Expected 37 YouTube exercise videos; found ${videoEntries}`);
          if(!index.includes('exercise-videos.css?v=286')) throw new Error('Real video CSS missing from app');
          console.log('Traço 2.1 Redline OK');
          NODE
      - name: Validate measurement centering
        run: |
          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('app.js','utf8');
          const css=fs.readFileSync('traco-theme.css','utf8');
          for(const required of [
            'placeholder="—"',
            'class="${val?\'\':\'is-empty\'}"',
            "$$('[data-edit-body]').forEach"
          ]){
            if(!app.includes(required)) throw new Error(`Missing body-centering feature: ${required}`);
          }
          for(const required of [
            'measurement optical centering',
            '.measure-form .unit-input input::placeholder',
            'top:50% !important',
            '.body-stats>div.is-empty .measure-value'
          ]){
            if(!css.includes(required)) throw new Error(`Missing body-centering CSS: ${required}`);
          }
          console.log('Measurement centering OK');
          NODE
      - name: Validate Gym UX Pass 2.3
        run: |
          node <<'NODE'
          const fs=require('fs');
          const ux=fs.readFileSync('traco-gym-ux.js','utf8');
          const css=fs.readFileSync('traco-gym-ux.css','utf8');
          const index=fs.readFileSync('index.html','utf8');
          const sw=fs.readFileSync('sw.js','utf8');

          for(const required of [
            'TRACO_GYM_UX_VERSION',
            "typeof v60GuidePreview==='function'?v60GuidePreview(ex):''",
            'traco-home-xp',
            'traco-gym-stepper',
            'tracoGymLastWorkout',
            'ver evolução de:',
            'exercícios com histórico',
            'traco-data-support',
            'TRACO_LAST_LEVEL_KEY'
          ]){
            if(!ux.includes(required)) throw new Error(`Missing gym UX feature: ${required}`);
          }
          for(const required of [
            '--traco-action:#FF3B30',
            '--traco-achievement:#F4C542',
            '--traco-muted:#A8ABB2',
            '.traco-execution-trigger',
            '.traco-home-xp',
            '.traco-achievement-card',
            '.traco-level-up',
            'width:52px !important'
          ]){
            if(!css.includes(required)) throw new Error(`Missing gym UX design rule: ${required}`);
          }
          if(!index.includes('traco-gym-ux.css?v=286')||!index.includes('traco-gym-ux.js?v=286')) throw new Error('Gym UX assets not loaded last');
          if(!sw.includes("'./traco-gym-ux.js'")||!sw.includes("'./traco-gym-ux.css'")||!sw.includes("'./privacy.html'")||!sw.includes("'./support.html'")) throw new Error('Gym UX/support not offline-cached');
          console.log('Traço 2.3 Gym UX Pass OK');
          NODE
      - name: Validate full set queue ordering
        run: |
          node <<'NODE'
          const fs=require('fs');
          const ux=fs.readFileSync('traco-gym-ux.js','utf8');
          const css=fs.readFileSync('traco-gym-ux.css','utf8');
          const brand=fs.readFileSync('traco-brand.js','utf8');

          for(const required of [
            "TRACO_SET_ORDER_KEY='traco_set_order_v1'",
            'tracoGymQueueToken',
            'tracoGymNormalizeQueue',
            'tracoGymEnsureSessionQueue',
            'tracoGymNextQueueToken',
            'tracoGymSyncQueueCursor',
            'tracoGymOpenSetOrderEditor',
            'cada linha é uma série',
            'editar ordem padrão',
            'fila do treino',
            'ordem das séries salva',
            'fila atualizada',
            "const tracoGymBaseCurrentSetIndex=currentSetIndex"
          ]){
            if(!ux.includes(required)) throw new Error(`Missing full-set queue feature: ${required}`);
          }
          for(const required of [
            '.traco-organize-exercises',
            '.traco-order-backdrop',
            '.traco-order-sheet',
            '.traco-order-controls button',
            '.traco-active-queue',
            '.traco-order-done-note',
            'min-width:48px'
          ]){
            if(!css.includes(required)) throw new Error(`Missing full-set queue style: ${required}`);
          }
          if(!ux.includes("$$('[data-order-up]').forEach")||!ux.includes("$$('[data-order-down]').forEach")) throw new Error('Set-order controls must use querySelectorAll');
          if(!brand.includes("key.startsWith('traco_')")) throw new Error('Set order would be missing from backup');
          console.log('Full set queue OK: every set can be reordered, including active workout');
          NODE
      - name: Validate pre-start normal-screen hotfix
        run: |
          node <<'NODE'
          const fs=require('fs');
          const ux=fs.readFileSync('traco-gym-ux.js','utf8');
          const css=fs.readFileSync('traco-gym-ux.css','utf8');

          for(const required of [
            'function tracoGymOpenPreStart',
            'function tracoGymClosePreStart',
            'traco-prestart-page-inner',
            'ajustar ordem das séries',
            'começar assim',
            "const tracoGymBaseStartSession=startSession",
            'tracoGymBaseStartSession(workoutId)',
            'tracoGymPreStartWorkoutId',
            'tracoGymPreStartReturnPage'
          ]){
            if(!ux.includes(required)) throw new Error(`Missing normal pre-start flow: ${required}`);
          }

          if(ux.includes("document.body.classList.add('traco-prestart-open')")) throw new Error('Pre-start still uses body-lock modal class');
          if(ux.includes("requestAnimationFrame(()=>")) throw new Error('Pre-start still depends on deferred start');

          for(const required of [
            'Traço 2.3.4 — pre-start as normal page',
            '.traco-prestart-page',
            'overflow-y:auto',
            '-webkit-overflow-scrolling:touch',
            '.traco-prestart-back'
          ]){
            if(!css.includes(required)) throw new Error(`Missing normal pre-start CSS: ${required}`);
          }

          if(!ux.includes("document.querySelectorAll('.perf-value-panel [data-adjust]').forEach")) throw new Error('Gym stepper selector regression');
          if(!ux.includes("$$('.workout-select[data-workout]').forEach")) throw new Error('Workout-card selector regression');

          console.log('Pre-start hotfix OK: normal screen + scroll + deterministic start');
          NODE
      - name: Validate active exercise switcher
        run: |
          node <<'NODE'
          const fs=require('fs');
          const ux=fs.readFileSync('traco-gym-ux.js','utf8');
          const perf=fs.readFileSync('traco-performance.js','utf8');
          const css=fs.readFileSync('traco-gym-ux.css','utf8');
          for(const required of ['tracoGymMoveExerciseNext','tracoGymExerciseStatus','session.tracoSetQueue=[...doneTokens,...chosen,...other]']){
            if(!ux.includes(required)) throw new Error(`Missing exercise-order behavior: ${required}`);
          }
          for(const required of ['perf-native-exercise-list','data-native-exercise-index','lista de exercícios','toque no exercício que você quer fazer agora']){
            if(!perf.includes(required)) throw new Error(`Missing native exercise list: ${required}`);
          }
          for(const required of ['.perf-native-exercise-list','.perf-native-exercise-row','html[data-theme="light"] .perf-native-exercise-list']){
            if(!css.includes(required)) throw new Error(`Missing native exercise-list style: ${required}`);
          }
          if(!ux.includes("nativeList.querySelectorAll('[data-native-exercise-index]').forEach")) throw new Error('Native exercise list enhancer missing');
          if(!ux.includes("tracoGymOpenSetOrderEditor(session.workoutId,{session})")) throw new Error('Edit-order binding missing');
          if(!ux.includes("document.querySelectorAll('.perf-value-panel [data-adjust]').forEach")) throw new Error('Gym stepper selector regression');
          if(!ux.includes("data-traco-gym-version','2.4.1'")) throw new Error('Active workout release marker missing');
          console.log('Native active-workout list OK');
          NODE
      - name: Validate iPhone scroll and pre-start workout entry
        run: |
          node <<'NODE'
          const fs=require('fs');
          const ux=fs.readFileSync('traco-gym-ux.js','utf8');
          const css=fs.readFileSync('traco-gym-ux.css','utf8');

          for(const required of [
            "const TRACO_GYM_UX_VERSION='2.4.0'",
            'function tracoGymDirectStart',
            'function tracoGymOpenPreStart',
            'startSession=tracoGymDirectStart;',
            "if($('#startToday'))$('#startToday').onclick=()=>startSession(homeWorkout.id)",
            "if($('#resumeWorkout')&&draft)$('#resumeWorkout').onclick=()=>tracoGymDirectStart(draft.workoutId)",
            "tracoGymDirectStart(workoutId);",
            'ajustar ordem das séries',
            'começar assim'
          ]){
            if(!ux.includes(required)) throw new Error(`Missing pre-start entry recovery: ${required}`);
          }

          for(const required of [
            'Traço 2.3.14 — definitive normal-page scroll recovery',
            '.traco-prestart-page .traco-prestart-go',
            'position:static !important',
            'overflow-y:auto !important',
            'touch-action:pan-y !important'
          ]){
            if(!css.includes(required)) throw new Error(`Missing iPhone scroll recovery: ${required}`);
          }

          if(css.includes('.traco-prestart-page .traco-prestart-go{\n  position:fixed !important')) throw new Error('Pre-start start button still fixed');
          console.log('iPhone hotfix OK: normal scroll + pre-start + reliable workout entry');
          NODE
      - name: Validate active workout order and Sep 18 record
        run: |
          node <<'NODE'
          const fs=require('fs');
          const ux=fs.readFileSync('traco-gym-ux.js','utf8');
          const perf=fs.readFileSync('traco-performance.js','utf8');
          const smart=fs.readFileSync('v60-smart-sequence.js','utf8');
          for(const required of ['tracoGymOpenSetOrderEditor','tracoGymMoveExerciseNext','tracoGymRepairOverlayState();']){
            if(!ux.includes(required)) throw new Error(`Missing active-workout order behavior: ${required}`);
          }
          for(const required of ['perf-native-exercise-list','data-native-exercise-index']){
            if(!perf.includes(required)) throw new Error(`Missing native active-workout UI: ${required}`);
          }
          for(const required of [
            "V60_REPORTED_TODAY_KEY='v60_reported_history_20260918_v1'",
            "date='2026-09-18'",
            "['extensora','extensora','Cadeira extensora',4,10,25,null]",
            "['leg-press','leg press 45°','Leg press 45°',4,10,80,null]",
            "['mesa-flexora','mesa flexora','Mesa flexora',3,10,20,null]",
            "['elevacao-pelvica','elevação pélvica','Máquina / barra',3,10,20,'por lado']",
            "v60BootstrapReportedToday();"
          ]){if(!smart.includes(required)) throw new Error(`Missing Sep 18 workout seed: ${required}`);}
          console.log('Native active workout + Sep 18 record OK');
          NODE
      - name: Validate offline-ready PWA
        run: |
          node <<'NODE'
          const fs=require('fs');
          const sw=fs.readFileSync('sw.js','utf8');
          const media=fs.readFileSync('exercise-videos.js','utf8');
          const index=fs.readFileSync('index.html','utf8');
          const css=fs.readFileSync('exercise-videos.css','utf8');

          for(const required of [
            "const CACHE = 'traco-v71'",
            "ignoreSearch:true",
            "caches.match('./index.html',{ignoreSearch:true})",
            "cache.addAll(ASSETS)",
            "'./exercise-videos.js'",
            "'./traco-performance.js'",
            "'./assets/traco-icon-512.png'"
          ]){
            if(!sw.includes(required)) throw new Error(`Missing offline service-worker feature: ${required}`);
          }

          for(const required of [
            "navigator.onLine===false",
